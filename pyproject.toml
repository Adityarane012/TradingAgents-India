[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.5.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    # HTML parsing for the two India sources that have no API: RBI's policy
    # rate box (rbi.org.in) and screener.in's shareholding tables. Upstream
    # dropped parsel in v0.5.0 because nothing there needed it any more; this
    # fork re-declares it because rbi_rates.py and screener_in.py import it at
    # module level, and a bare `pip install .` must be able to import the
    # package. Nothing else in the dependency tree provides it. Its heaviest
    # transitive dep (lxml) is already required by yfinance, so the marginal
    # cost here is a few small pure-Python packages.
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    # The three below are imported directly by this codebase but were only
    # ever available transitively — pydantic through langchain, dateutil
    # through pandas, prompt_toolkit through questionary. That works until an
    # upstream package drops or bounds one of them, at which point the break
    # appears somewhere unrelated and is hard to trace. If you import it, you
    # declare it. Floors are set below the versions in use, not pinned to
    # them, so they cannot fight the resolver.
    "pydantic>=2.0",             # agents/schemas.py, structured.py, portfolio.py
    "python-dateutil>=2.8",      # dataflows: y_finance, yfinance_news, alpha_vantage
    "prompt_toolkit>=3.0",       # cli/main.py
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]
# Local FinBERT headline scoring (local_sentiment="finbert"). Optional because
# torch is large; everything works without it, headlines just go unscored.
sentiment = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
